# https://taskfile.dev
version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  IMAGE: '{{.IMAGE | default "aifs:local"}}'
  GO_LDFLAGS: >-
    -s -w
    -X github.com/ipedrazas/aifs/api/internal/version.Version={{.VERSION}}
    -X github.com/ipedrazas/aifs/api/internal/version.Commit={{.COMMIT}}
  # Pinned tool versions. CI uses the same ones.
  OPENAPI_TS_VERSION: 7.13.0
  GOVULNCHECK_VERSION: v1.9.0
  AIR_VERSION: v1.65.1
  E2E_PORT: '{{.E2E_PORT | default "18080"}}'
  E2E_NAME: aifs-e2e
  E2E_PASSWORD: e2e-password-123

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # --- setup -----------------------------------------------------------------

  setup:
    desc: Install frontend dependencies and the Playwright browser
    cmds:
      - task: web:install
      - cd web && npx playwright install chromium

  web:install:
    dir: web
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci

  # --- development -----------------------------------------------------------

  dev:
    desc: Run the API (live reload) and the Vite dev server together
    deps: [dev:api, dev:web]

  dev:api:
    dir: api
    env:
      AIFS_ENV: development
      AIFS_DATA_DIR: ../tmp/data
      AIFS_ADDR: 127.0.0.1:8080
      AIFS_LOG_LEVEL: debug
      # Development mode defaults the password to "dev". Plain-HTTP cookie so
      # every browser accepts it on the Vite dev server.
      AIFS_COOKIE_SECURE: "false"
    cmds:
      - go run github.com/air-verse/air@{{.AIR_VERSION}}

  dev:web:
    dir: web
    deps: [web:install]
    cmds:
      - npm run dev

  # --- code generation -------------------------------------------------------

  generate:
    desc: Generate TypeScript API types from openapi.yaml
    cmds:
      - cd web && npx --yes openapi-typescript@{{.OPENAPI_TS_VERSION}} ../openapi.yaml -o src/api/schema.d.ts

  generate:check:
    desc: Fail if generated code differs from what is committed
    deps: [generate]
    cmds:
      - git diff --exit-code -- web/src/api/schema.d.ts

  # --- lint & test -----------------------------------------------------------

  lint:
    desc: Lint Go and frontend code
    deps: [lint:go, lint:web]

  lint:go:
    dir: api
    cmds:
      - golangci-lint run ./...
      - go vet ./...

  lint:web:
    dir: web
    deps: [web:install]
    cmds:
      - npm run lint
      - npm run typecheck

  test:
    desc: Run Go and frontend unit tests
    deps: [test:go, test:web]

  test:go:
    dir: api
    cmds:
      - go test -race -count=1 ./...

  test:web:
    dir: web
    deps: [web:install]
    cmds:
      - npm test

  vulncheck:
    desc: Check Go dependencies for known vulnerabilities
    dir: api
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  # --- build -----------------------------------------------------------------

  build:web:
    dir: web
    deps: [web:install]
    cmds:
      - npm run build

  build:
    desc: Build the single binary with the frontend embedded (bin/aifs)
    deps: [build:web]
    cmds:
      - find api/internal/webui/dist -mindepth 1 ! -name .gitkeep -delete
      - cp -R web/dist/. api/internal/webui/dist/
      - cd api && CGO_ENABLED=0 go build -trimpath -ldflags "{{.GO_LDFLAGS}}" -o ../bin/aifs ./cmd/aifs

  # --- docker ----------------------------------------------------------------

  docker:build:
    desc: Build the Docker image (IMAGE=aifs:local)
    cmds:
      - >-
        docker build
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT={{.COMMIT}}
        -t {{.IMAGE}} .

  docker:up:
    desc: Build and start the app with Docker Compose on http://localhost:8080 (needs AIFS_PASSWORD, e.g. in .env)
    cmds:
      - VERSION={{.VERSION}} COMMIT={{.COMMIT}} docker compose up -d --build --wait
      - docker compose ps

  docker:down:
    desc: Stop the Compose stack (the data volume is kept)
    cmds:
      - docker compose down

  # --- end to end ------------------------------------------------------------

  e2e:
    desc: Smoke-test the Docker image with Playwright (builds the image unless SKIP_BUILD=1)
    cmds:
      - task: '{{if eq .SKIP_BUILD "1"}}e2e:noop{{else}}docker:build{{end}}'
      - defer: docker rm -f {{.E2E_NAME}} >/dev/null 2>&1; docker volume rm -f {{.E2E_NAME}}-data >/dev/null 2>&1; true
      - docker rm -f {{.E2E_NAME}} >/dev/null 2>&1 || true
      - docker run -d --name {{.E2E_NAME}} -p 127.0.0.1:{{.E2E_PORT}}:8080 -v {{.E2E_NAME}}-data:/data -e AIFS_PASSWORD={{.E2E_PASSWORD}} {{.IMAGE}}
      - ./scripts/wait-healthy.sh {{.E2E_NAME}} 60
      - ./scripts/check-image.sh {{.E2E_NAME}} {{.IMAGE}}
      - cd web && E2E_BASE_URL=http://127.0.0.1:{{.E2E_PORT}} E2E_EXPECT_VERSION={{.VERSION}} E2E_PASSWORD={{.E2E_PASSWORD}} npx playwright test

  e2e:noop:
    internal: true
    cmds: []

  # --- everything CI runs ----------------------------------------------------

  ci:
    desc: Run every check CI runs (lint, tests, vulncheck, drift, image build, e2e)
    cmds:
      - task: lint
      - task: test
      - task: vulncheck
      - task: generate:check
      - task: build
      - task: e2e

  clean:
    desc: Remove build outputs and local dev data
    cmds:
      - rm -rf bin tmp web/dist
      - find api/internal/webui/dist -mindepth 1 ! -name .gitkeep -delete
