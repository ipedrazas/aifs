openapi: 3.1.0
info:
  title: AI Fashion Studio API
  version: 0.1.0
  description: |
    The contract between the Go API and the React frontend. TypeScript types in
    `web/src/api/schema.d.ts` are generated from this file with `task generate`;
    CI fails when they drift.
servers:
  - url: /
security:
  - session: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and readiness probe
      description: Unauthenticated. Returns 503 when the database is unreachable.
      tags: [system]
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/session:
    get:
      operationId: getSession
      summary: Current session
      tags: [session]
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: login
      summary: Log in with the shared password
      description: |
        Sets the session cookie. Attempts are rate limited per client and in
        total; a limited request gets 429 with `Retry-After`.
      tags: [session]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: Incorrect password (`invalid_password`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "429":
          description: Too many attempts (`rate_limited`)
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: logout
      summary: Log out
      tags: [session]
      responses:
        "204":
          description: Logged out; the session cookie is cleared
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOrigin"
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Server build and schema version
      tags: [system]
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List products, newest first
      tags: [products]
      responses:
        "200":
          description: Products with their cover photograph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createProduct
      summary: Create a product
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProduct
      summary: A product with all its reference photographs
      tags: [products]
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProduct
      summary: Change product fields
      description: Fields that are absent are left unchanged. An empty `sku` clears it.
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: The updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProduct
      summary: Delete a product and its photographs
      tags: [products]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/products/{id}/images:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      operationId: uploadProductImage
      summary: Upload one reference photograph
      description: |
        JPEG, PNG or WebP, up to `AIFS_MAX_UPLOAD_MB` (default 30 MB) and 64
        megapixels. The type is detected from the bytes and the image is fully
        decoded to reject damaged files. The bytes are stored exactly as
        uploaded and can never be modified, only deleted.
      tags: [products]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [view, file]
              properties:
                view:
                  $ref: "#/components/schemas/View"
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The same photograph is already attached (`conflict`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File too large (`too_large`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Not an accepted or readable image (`invalid_image`), or invalid view (`invalid`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/products/{id}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      operationId: deleteProductImage
      summary: Delete a reference photograph record
      description: The stored bytes are removed when no other record uses them.
      tags: [products]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/models:
    get:
      operationId: listModels
      summary: List virtual models, newest first
      tags: [models]
      parameters:
        - name: archived
          in: query
          description: Include archived models.
          schema:
            type: boolean
      responses:
        "200":
          description: Models with their cover image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createModel
      summary: Create a virtual model
      tags: [models]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/models/{id}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: getModel
      summary: A model (archived or not) with all its reference images
      tags: [models]
      responses:
        "200":
          description: The model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateModel
      summary: Change model fields, archive or restore
      tags: [models]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelInput"
      responses:
        "200":
          description: The updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteModel
      summary: Delete a model, or archive it if it has been used
      description: |
        A model nothing refers to is deleted with its images (204). A model
        that has been used (by a generation or photoshoot) is archived instead
        and returned (200), so the history that used it stays traceable.
      tags: [models]
      responses:
        "200":
          description: The model was in use and has been archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/models/{id}/images:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    post:
      operationId: uploadModelImage
      summary: Upload one reference image of the model
      description: Same rules as product photographs; stored unchanged.
      tags: [models]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [role, file]
              properties:
                role:
                  $ref: "#/components/schemas/ModelImageRole"
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelImage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/models/{id}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      operationId: deleteModelImage
      summary: Delete a model reference image record
      tags: [models]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/photoshoots:
    get:
      operationId: listPhotoshoots
      summary: List photoshoots, most recently used first
      tags: [photoshoots]
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Photoshoots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoshootList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createPhotoshoot
      summary: Create a photoshoot (product + model)
      tags: [photoshoots]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoshootInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photoshoot"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/photoshoots/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getPhotoshoot
      summary: A photoshoot with its generations, newest first
      tags: [photoshoots]
      responses:
        "200":
          description: The photoshoot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photoshoot"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePhotoshoot
      summary: Change a photoshoot; past generations keep their snapshot
      tags: [photoshoots]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoshootInput"
      responses:
        "200":
          description: The updated photoshoot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photoshoot"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePhotoshoot
      summary: Delete a photoshoot that has never been generated from
      tags: [photoshoots]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/photoshoots/{id}/generations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: startGeneration
      summary: Queue a generation; returns immediately
      description: |
        Validates the request, plans every provider call and queues it. Poll
        `GET /api/v1/generations/{id}` for progress.
      tags: [generations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationRequest"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Generation"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/generations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getGeneration
      summary: A generation with its steps and images
      tags: [generations]
      responses:
        "200":
          description: The generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Generation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/generations/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: cancelGeneration
      summary: Cancel a queued or running generation; produced images are kept
      tags: [generations]
      responses:
        "200":
          description: Cancelled, or cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Generation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Already finished (`conflict`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/images:
    get:
      operationId: listImages
      summary: Generated images, newest first
      tags: [images]
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
            format: int64
        - name: photoshootId
          in: query
          schema:
            type: integer
            format: int64
        - name: generationId
          in: query
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReviewStatus"
      responses:
        "200":
          description: Images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/images/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getImage
      summary: A generated image with the full snapshot that produced it
      tags: [images]
      responses:
        "200":
          description: The image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/images/{id}/review:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: reviewImage
      summary: Record a human review decision
      description: |
        The only way an image's review status changes. Every decision is kept
        in `reviewHistory`; review again to change it. A rejection needs a
        reason. Images can never return to `pending`.
      tags: [images]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "200":
          description: The image with its updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/providers:
    get:
      operationId: listProviders
      summary: Configured providers, recipes and limits
      tags: [generations]
      responses:
        "200":
          description: Providers and recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Providers"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/blobs/{hash}:
    get:
      operationId: getBlob
      summary: Image bytes by content hash
      description: |
        Without `w`, the stored bytes exactly as uploaded. With `w`, an upright
        (EXIF orientation applied) JPEG at most `w` pixels wide; `w` rounds up
        to 256, 512, 1024 or 2048.
      tags: [blobs]
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: w
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (ETag match)
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-aifs_session
      description: |
        Set by `POST /api/v1/session`. Named `aifs_session` when the server runs
        with `AIFS_COOKIE_SECURE=false`.
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ModelId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Unauthenticated:
      description: No valid session (`unauthenticated`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: Cross-origin state-changing request rejected (`cross_origin`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    View:
      type: string
      enum: [front, back, side, detail, print]
    ProductInput:
      type: object
      additionalProperties: false
      description: All fields optional on update; `name` is required on create.
      properties:
        name:
          type: string
          maxLength: 200
        sku:
          type: string
          maxLength: 64
          description: Product identifier, unique (case-insensitive) when set.
        category:
          type: string
          maxLength: 100
          description: Defaults to `jeans`.
        description:
          type: string
          maxLength: 5000
        colour:
          type: string
          maxLength: 5000
        printDetails:
          type: string
          maxLength: 5000
        notes:
          type: string
          maxLength: 5000
    Product:
      type: object
      required: [id, name, sku, category, description, colour, printDetails, notes, createdAt, updatedAt, imageCount, cover]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sku:
          type: string
        category:
          type: string
        description:
          type: string
        colour:
          type: string
        printDetails:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        imageCount:
          type: integer
        cover:
          description: First front photograph, else the first photograph.
          oneOf:
            - $ref: "#/components/schemas/ProductImage"
            - type: "null"
        images:
          description: Present on single-product responses, ordered front, back, side, detail, print.
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
    ProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    ProductImage:
      type: object
      required: [id, productId, hash, view, filename, contentType, size, width, height, createdAt]
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        hash:
          type: string
          description: SHA-256 of the stored bytes; fetch them from `/api/v1/blobs/{hash}`.
        view:
          $ref: "#/components/schemas/View"
        filename:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          format: int64
        width:
          type: integer
          description: Displayed width, after EXIF orientation.
        height:
          type: integer
        createdAt:
          type: string
          format: date-time
    ModelImageRole:
      type: string
      enum: [identity, full_body]
      description: "`identity`: face and likeness; `full_body`: build and proportions."
    ModelInput:
      type: object
      additionalProperties: false
      description: All fields optional on update; `name` is required on create.
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          description: Descriptive profile.
        appearance:
          type: string
          maxLength: 5000
          description: Appearance attributes.
        preferredPoses:
          type: string
          maxLength: 5000
        styling:
          type: string
          maxLength: 5000
        archived:
          type: boolean
          description: Update only. `false` restores an archived model.
    Model:
      type: object
      required: [id, name, description, appearance, preferredPoses, styling, origin, archived, archivedAt, createdAt, updatedAt, imageCount, cover]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        appearance:
          type: string
        preferredPoses:
          type: string
        styling:
          type: string
        origin:
          type: string
          enum: [uploaded, generated]
        archived:
          type: boolean
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        imageCount:
          type: integer
        cover:
          description: First identity image, else the first image.
          oneOf:
            - $ref: "#/components/schemas/ModelImage"
            - type: "null"
        images:
          description: Present on single-model responses, identity images first.
          type: array
          items:
            $ref: "#/components/schemas/ModelImage"
    ModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    ModelImage:
      type: object
      required: [id, modelId, hash, role, filename, contentType, size, width, height, createdAt]
      properties:
        id:
          type: integer
          format: int64
        modelId:
          type: integer
          format: int64
        hash:
          type: string
        role:
          $ref: "#/components/schemas/ModelImageRole"
        filename:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        createdAt:
          type: string
          format: date-time
    AspectRatio:
      type: string
      enum: ["3:4", "4:5", "2:3", "1:1", "9:16", "4:3", "16:9"]
    PhotoshootInput:
      type: object
      additionalProperties: false
      description: "`productId` and `modelId` are required on create; absent fields are unchanged on update."
      properties:
        name:
          type: string
          maxLength: 200
          description: Defaults to "<product> on <model>".
        productId:
          type: integer
          format: int64
        modelId:
          type: integer
          format: int64
          description: Must not be archived.
        aspectRatio:
          $ref: "#/components/schemas/AspectRatio"
        customInstructions:
          type: string
          maxLength: 2000
    ProductSummary:
      type: object
      required: [id, name, sku, coverHash]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sku:
          type: string
        coverHash:
          type: string
    ModelSummary:
      type: object
      required: [id, name, archived, coverHash]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        archived:
          type: boolean
        coverHash:
          type: string
    Photoshoot:
      type: object
      required: [id, name, productId, modelId, aspectRatio, customInstructions, createdAt, updatedAt, product, model, generationCount, latestImageHash]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        productId:
          type: integer
          format: int64
        modelId:
          type: integer
          format: int64
        aspectRatio:
          $ref: "#/components/schemas/AspectRatio"
        customInstructions:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        product:
          $ref: "#/components/schemas/ProductSummary"
        model:
          $ref: "#/components/schemas/ModelSummary"
        generationCount:
          type: integer
        latestImageHash:
          type: string
          description: Newest generated image, or empty.
        generations:
          description: Present on single-photoshoot responses, newest first (up to 100).
          type: array
          items:
            $ref: "#/components/schemas/Generation"
    PhotoshootList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Photoshoot"
    GenerationRequest:
      type: object
      additionalProperties: false
      required: [recipe, provider, variations]
      properties:
        recipe:
          type: string
          description: A recipe name from `GET /api/v1/providers`.
        provider:
          type: string
        variations:
          type: integer
          minimum: 1
          description: Capped by `AIFS_MAX_VARIATIONS` (see `maxVariations` in `GET /api/v1/providers`).
    GenerationStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    StepStatus:
      type: string
      enum: [pending, submitted, succeeded, failed, cancelled]
    ReviewStatus:
      type: string
      enum: [pending, approved, rejected, needs_refinement]
    GenerationInput:
      type: object
      required: [position, role, label, hash]
      properties:
        position:
          type: integer
        role:
          type: string
          enum: [garment, model]
        label:
          type: string
          description: Product view or model image role.
        hash:
          type: string
    Snapshot:
      type: object
      description: The complete, immutable record of what produced a generation's images.
      required: [recipe, provider, variations, aspectRatio, customInstructions, photoshoot, product, model, steps, inputs]
      properties:
        recipe:
          type: string
        provider:
          type: string
        variations:
          type: integer
        aspectRatio:
          type: string
        customInstructions:
          type: string
        photoshoot:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        product:
          type: object
          required: [id, name, sku, category, colour, printDetails]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            sku:
              type: string
            category:
              type: string
            colour:
              type: string
            printDetails:
              type: string
        model:
          type: object
          required: [id, name, appearance, preferredPoses, styling]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            appearance:
              type: string
            preferredPoses:
              type: string
            styling:
              type: string
        steps:
          type: array
          items:
            type: object
            required: [position, capability, purpose, provider, providerModel, prompt, inputs, usesPrevious]
            properties:
              position:
                type: integer
              capability:
                type: string
              purpose:
                type: string
              provider:
                type: string
              providerModel:
                type: string
              prompt:
                type: string
              inputs:
                type: array
                description: Positions in `inputs` sent with this step.
                items:
                  type: integer
              usesPrevious:
                type: boolean
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/GenerationInput"
    Step:
      type: object
      required: [id, variation, position, capability, provider, providerModel, providerJobId, status, attempts, error, costMicros, outputHash, startedAt, finishedAt]
      properties:
        id:
          type: integer
          format: int64
        variation:
          type: integer
        position:
          type: integer
        capability:
          type: string
        provider:
          type: string
        providerModel:
          type: string
        providerJobId:
          type: string
        status:
          $ref: "#/components/schemas/StepStatus"
        attempts:
          type: integer
        error:
          type: string
        costMicros:
          type: integer
          format: int64
        outputHash:
          type: string
        startedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        finishedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    Generation:
      type: object
      required: [id, photoshootId, productId, modelId, recipe, provider, variations, status, error, costMicros, cancelRequested, prompt, createdAt, startedAt, finishedAt, stepsTotal, stepsDone, settings, images]
      properties:
        id:
          type: integer
          format: int64
        photoshootId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        modelId:
          type: integer
          format: int64
        recipe:
          type: string
        provider:
          type: string
        variations:
          type: integer
        status:
          $ref: "#/components/schemas/GenerationStatus"
        error:
          type: string
          description: Readable reason for a failed generation.
        costMicros:
          type: integer
          format: int64
          description: Total cost in millionths of a US dollar.
        cancelRequested:
          type: boolean
        prompt:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        finishedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        stepsTotal:
          type: integer
        stepsDone:
          type: integer
        settings:
          $ref: "#/components/schemas/Snapshot"
        images:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedImage"
        steps:
          description: Present on single-generation responses.
          type: array
          items:
            $ref: "#/components/schemas/Step"
    GeneratedImage:
      type: object
      required: [id, generationId, variation, hash, width, height, reviewStatus, rejectionReason, reviewerNotes, reviewedAt, createdAt, recipe, provider, photoshootId, product, model]
      properties:
        id:
          type: integer
          format: int64
        generationId:
          type: integer
          format: int64
        variation:
          type: integer
        hash:
          type: string
        width:
          type: integer
        height:
          type: integer
        reviewStatus:
          $ref: "#/components/schemas/ReviewStatus"
        rejectionReason:
          description: Set when rejected, otherwise empty.
          oneOf:
            - $ref: "#/components/schemas/RejectionReason"
            - type: string
              const: ""
        reviewerNotes:
          type: string
        reviewedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        recipe:
          type: string
        provider:
          type: string
        photoshootId:
          type: integer
          format: int64
        product:
          $ref: "#/components/schemas/ProductSummary"
        model:
          $ref: "#/components/schemas/ModelSummary"
    ImageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedImage"
    ImageDetail:
      allOf:
        - $ref: "#/components/schemas/GeneratedImage"
        - type: object
          required: [prompt, settings, steps, costMicros, reviewHistory]
          properties:
            prompt:
              type: string
            settings:
              $ref: "#/components/schemas/Snapshot"
            steps:
              type: array
              description: The provider calls that produced this image.
              items:
                $ref: "#/components/schemas/Step"
            costMicros:
              type: integer
              format: int64
            reviewHistory:
              type: array
              description: Every review decision, oldest first.
              items:
                $ref: "#/components/schemas/ReviewEvent"
    RejectionReason:
      type: string
      enum: [fidelity, photo_quality, other]
    ReviewDecision:
      type: string
      enum: [approved, rejected, needs_refinement]
    ReviewInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ReviewDecision"
        reason:
          description: Required when rejecting; omit otherwise.
          $ref: "#/components/schemas/RejectionReason"
        notes:
          type: string
          maxLength: 2000
    ReviewEvent:
      type: object
      required: [id, status, rejectionReason, notes, createdAt]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ReviewDecision"
        rejectionReason:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
    Providers:
      type: object
      required: [providers, recipes, maxVariations]
      properties:
        maxVariations:
          type: integer
        providers:
          type: array
          items:
            type: object
            required: [name, label, capabilities, models, unitPriceMicros, recipes]
            properties:
              name:
                type: string
              label:
                type: string
              capabilities:
                type: array
                items:
                  type: string
              models:
                type: object
                additionalProperties:
                  type: string
              unitPriceMicros:
                type: integer
                format: int64
              recipes:
                type: array
                description: Recipes this provider can run on its own.
                items:
                  type: string
        recipes:
          type: array
          items:
            type: object
            required: [name, label, description, steps]
            properties:
              name:
                type: string
              label:
                type: string
              description:
                type: string
              steps:
                type: array
                items:
                  type: object
                  required: [capability, purpose]
                  properties:
                    capability:
                      type: string
                    purpose:
                      type: string
    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
    Session:
      type: object
      required: [authenticated, expiresAt]
      properties:
        authenticated:
          type: boolean
          const: true
        expiresAt:
          type: string
          format: date-time
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Version:
      type: object
      required: [version, commit, schemaVersion]
      properties:
        version:
          type: string
          examples: ["v0.1.0"]
        commit:
          type: string
        schemaVersion:
          type: integer
          description: Highest applied database migration.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code.
            message:
              type: string
              description: Human-readable message.
            fields:
              type: object
              description: Invalid input fields and why (code `invalid`).
              additionalProperties:
                type: string
