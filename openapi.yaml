openapi: 3.1.0
info:
  title: AI Fashion Studio API
  version: 0.1.0
  description: |
    The contract between the Go API and the React frontend. TypeScript types in
    `web/src/api/schema.d.ts` are generated from this file with `task generate`;
    CI fails when they drift.
servers:
  - url: /
security:
  - session: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and readiness probe
      description: Unauthenticated. Returns 503 when the database is unreachable.
      tags: [system]
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/session:
    get:
      operationId: getSession
      summary: Current session
      tags: [session]
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: login
      summary: Log in with the shared password
      description: |
        Sets the session cookie. Attempts are rate limited per client and in
        total; a limited request gets 429 with `Retry-After`.
      tags: [session]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: Incorrect password (`invalid_password`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "429":
          description: Too many attempts (`rate_limited`)
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: logout
      summary: Log out
      tags: [session]
      responses:
        "204":
          description: Logged out; the session cookie is cleared
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOrigin"
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Server build and schema version
      tags: [system]
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List products, newest first
      tags: [products]
      responses:
        "200":
          description: Products with their cover photograph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createProduct
      summary: Create a product
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProduct
      summary: A product with all its reference photographs
      tags: [products]
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProduct
      summary: Change product fields
      description: Fields that are absent are left unchanged. An empty `sku` clears it.
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: The updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProduct
      summary: Delete a product and its photographs
      tags: [products]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/products/{id}/images:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      operationId: uploadProductImage
      summary: Upload one reference photograph
      description: |
        JPEG, PNG or WebP, up to `AIFS_MAX_UPLOAD_MB` (default 30 MB) and 64
        megapixels. The type is detected from the bytes and the image is fully
        decoded to reject damaged files. The bytes are stored exactly as
        uploaded and can never be modified, only deleted.
      tags: [products]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [view, file]
              properties:
                view:
                  $ref: "#/components/schemas/View"
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The same photograph is already attached (`conflict`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File too large (`too_large`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Not an accepted or readable image (`invalid_image`), or invalid view (`invalid`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/products/{id}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      operationId: deleteProductImage
      summary: Delete a reference photograph record
      description: The stored bytes are removed when no other record uses them.
      tags: [products]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/models:
    get:
      operationId: listModels
      summary: List virtual models, newest first
      tags: [models]
      parameters:
        - name: archived
          in: query
          description: Include archived models.
          schema:
            type: boolean
      responses:
        "200":
          description: Models with their cover image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createModel
      summary: Create a virtual model
      tags: [models]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/models/{id}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: getModel
      summary: A model (archived or not) with all its reference images
      tags: [models]
      responses:
        "200":
          description: The model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateModel
      summary: Change model fields, archive or restore
      tags: [models]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelInput"
      responses:
        "200":
          description: The updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteModel
      summary: Delete a model, or archive it if it has been used
      description: |
        A model nothing refers to is deleted with its images (204). A model
        that has been used (by a generation or photoshoot) is archived instead
        and returned (200), so the history that used it stays traceable.
      tags: [models]
      responses:
        "200":
          description: The model was in use and has been archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/models/{id}/images:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    post:
      operationId: uploadModelImage
      summary: Upload one reference image of the model
      description: Same rules as product photographs; stored unchanged.
      tags: [models]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [role, file]
              properties:
                role:
                  $ref: "#/components/schemas/ModelImageRole"
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelImage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/models/{id}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      operationId: deleteModelImage
      summary: Delete a model reference image record
      tags: [models]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/blobs/{hash}:
    get:
      operationId: getBlob
      summary: Image bytes by content hash
      description: |
        Without `w`, the stored bytes exactly as uploaded. With `w`, an upright
        (EXIF orientation applied) JPEG at most `w` pixels wide; `w` rounds up
        to 256, 512, 1024 or 2048.
      tags: [blobs]
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: w
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (ETag match)
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-aifs_session
      description: |
        Set by `POST /api/v1/session`. Named `aifs_session` when the server runs
        with `AIFS_COOKIE_SECURE=false`.
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ModelId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Unauthenticated:
      description: No valid session (`unauthenticated`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: Cross-origin state-changing request rejected (`cross_origin`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    View:
      type: string
      enum: [front, back, side, detail, print]
    ProductInput:
      type: object
      additionalProperties: false
      description: All fields optional on update; `name` is required on create.
      properties:
        name:
          type: string
          maxLength: 200
        sku:
          type: string
          maxLength: 64
          description: Product identifier, unique (case-insensitive) when set.
        category:
          type: string
          maxLength: 100
          description: Defaults to `jeans`.
        description:
          type: string
          maxLength: 5000
        colour:
          type: string
          maxLength: 5000
        printDetails:
          type: string
          maxLength: 5000
        notes:
          type: string
          maxLength: 5000
    Product:
      type: object
      required: [id, name, sku, category, description, colour, printDetails, notes, createdAt, updatedAt, imageCount, cover]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sku:
          type: string
        category:
          type: string
        description:
          type: string
        colour:
          type: string
        printDetails:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        imageCount:
          type: integer
        cover:
          description: First front photograph, else the first photograph.
          oneOf:
            - $ref: "#/components/schemas/ProductImage"
            - type: "null"
        images:
          description: Present on single-product responses, ordered front, back, side, detail, print.
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
    ProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    ProductImage:
      type: object
      required: [id, productId, hash, view, filename, contentType, size, width, height, createdAt]
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        hash:
          type: string
          description: SHA-256 of the stored bytes; fetch them from `/api/v1/blobs/{hash}`.
        view:
          $ref: "#/components/schemas/View"
        filename:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          format: int64
        width:
          type: integer
          description: Displayed width, after EXIF orientation.
        height:
          type: integer
        createdAt:
          type: string
          format: date-time
    ModelImageRole:
      type: string
      enum: [identity, full_body]
      description: "`identity`: face and likeness; `full_body`: build and proportions."
    ModelInput:
      type: object
      additionalProperties: false
      description: All fields optional on update; `name` is required on create.
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          description: Descriptive profile.
        appearance:
          type: string
          maxLength: 5000
          description: Appearance attributes.
        preferredPoses:
          type: string
          maxLength: 5000
        styling:
          type: string
          maxLength: 5000
        archived:
          type: boolean
          description: Update only. `false` restores an archived model.
    Model:
      type: object
      required: [id, name, description, appearance, preferredPoses, styling, origin, archived, archivedAt, createdAt, updatedAt, imageCount, cover]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        appearance:
          type: string
        preferredPoses:
          type: string
        styling:
          type: string
        origin:
          type: string
          enum: [uploaded, generated]
        archived:
          type: boolean
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        imageCount:
          type: integer
        cover:
          description: First identity image, else the first image.
          oneOf:
            - $ref: "#/components/schemas/ModelImage"
            - type: "null"
        images:
          description: Present on single-model responses, identity images first.
          type: array
          items:
            $ref: "#/components/schemas/ModelImage"
    ModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    ModelImage:
      type: object
      required: [id, modelId, hash, role, filename, contentType, size, width, height, createdAt]
      properties:
        id:
          type: integer
          format: int64
        modelId:
          type: integer
          format: int64
        hash:
          type: string
        role:
          $ref: "#/components/schemas/ModelImageRole"
        filename:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        createdAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
    Session:
      type: object
      required: [authenticated, expiresAt]
      properties:
        authenticated:
          type: boolean
          const: true
        expiresAt:
          type: string
          format: date-time
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Version:
      type: object
      required: [version, commit, schemaVersion]
      properties:
        version:
          type: string
          examples: ["v0.1.0"]
        commit:
          type: string
        schemaVersion:
          type: integer
          description: Highest applied database migration.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code.
            message:
              type: string
              description: Human-readable message.
            fields:
              type: object
              description: Invalid input fields and why (code `invalid`).
              additionalProperties:
                type: string
