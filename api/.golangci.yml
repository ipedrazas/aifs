version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
  settings:
    misspell:
      locale: UK
      # Go standard library identifiers (image/color) use US spelling.
      ignore-rules: [color]
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
